[project]
name = "sciplay-home-assignment"
version = "0.1.0"
description = "Player analytics: data audit, 365-day LTV estimate, daily underperforming-player lists and a Streamlit dashboard"
readme = "README.md"
authors = [{ name = "Yotam Hadar" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    # data
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.1",
    # modelling
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "scipy>=1.13",
    "shap>=0.46",
    # app
    "streamlit>=1.39",
    "plotly>=5.24",
    # config and validation
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "ipykernel>=6.29",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
